# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: ""

# Replace entire persona (not merged)
persona:
  role: ""
  identity: ""
  communication_style: ""
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - "After completing a story, always prompt user before committing and pushing changes"

# Add persistent memories for the agent
memories: []
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu:
  - trigger: commit-push
    action: "#commit-prompt"
    description: Commit and push changes with confirmation
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts:
  - id: commit-prompt
    content: |
      Before committing and pushing changes, I need your confirmation.

      **Current git status:**
      [Run git status to show changes]

      **Do you want to commit and push these changes?** (y/n)
      - If yes, provide a commit message
      - If no, changes will remain uncommitted

      Your choice:
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
