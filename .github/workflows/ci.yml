name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t openai-adapter:${{ github.sha }} .

      - name: Test Docker image health endpoint
        run: |
          docker run -d -p 3000:3000 --name test-container openai-adapter:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker rm -f test-container

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image for integration tests
        run: docker build -t openai-adapter:${{ github.sha }} .

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          DOCKER_IMAGE: openai-adapter:${{ github.sha }}

      - name: Run regression tests
        run: npm run test:regression
        env:
          DOCKER_IMAGE: openai-adapter:${{ github.sha }}

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, integration-tests]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openai-adapter:${{ github.sha }}
